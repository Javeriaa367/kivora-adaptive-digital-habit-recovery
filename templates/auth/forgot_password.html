{% extends "base.html" %}
{% block title %}Reset password — Kivora{% endblock %}
{% block content %}
<section class="min-h-[calc(100vh-4rem-6rem)] flex items-center justify-center bg-ink bg-dot-grid px-5 py-16">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">
    <div class="text-center mb-8">
      <span class="inline-flex w-12 h-12 rounded-xl bg-teal-50 items-center justify-center text-teal-600 mb-4"><i class="fa-solid fa-key text-xl"></i></span>
      <h1 class="text-2xl font-display font-bold text-ink">Forgot your password?</h1>
      <p class="text-sm text-slate-500 mt-1">We'll email you a reset link.</p>
    </div>
    <form method="POST" class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div>
        <label class="block text-sm font-semibold text-slate-600 mb-1.5">Email</label>
        <input type="email" name="email" required autocomplete="email"
          class="w-full rounded-xl border border-slate-300 px-3 py-2.5 text-sm focus:border-teal-500 focus:ring-4 focus:ring-teal-100">
      </div>
      <button type="submit" class="w-full bg-ink hover:bg-slate-800 text-white font-semibold py-3 rounded-xl">Send reset link</button>
    </form>
    <p class="text-center text-sm text-slate-500 mt-6">
      <a href="{{ url_for('auth.login') }}" class="text-teal-600 font-semibold hover:underline">Back to log in</a>
    </p>
  </div>
</section>
{% endblock %}
