{% extends "base.html" %}
{% block title %}Set new password — Kivora{% endblock %}
{% block content %}
<section class="min-h-[calc(100vh-4rem-6rem)] flex items-center justify-center bg-ink bg-dot-grid px-5 py-16">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">
    <div class="text-center mb-8">
      <span class="inline-flex w-12 h-12 rounded-xl bg-teal-50 items-center justify-center text-teal-600 mb-4"><i class="fa-solid fa-lock text-xl"></i></span>
      <h1 class="text-2xl font-display font-bold text-ink">Set a new password</h1>
    </div>
    <form method="POST" class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div>
        <label class="block text-sm font-semibold text-slate-600 mb-1.5">New password</label>
        <input type="password" name="password" required minlength="8" autocomplete="new-password"
          class="w-full rounded-xl border border-slate-300 px-3 py-2.5 text-sm focus:border-teal-500 focus:ring-4 focus:ring-teal-100">
        <p class="text-xs text-slate-400 mt-1">At least 8 characters, with a letter and a number</p>
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-600 mb-1.5">Confirm password</label>
        <input type="password" name="confirm_password" required minlength="8" autocomplete="new-password"
          class="w-full rounded-xl border border-slate-300 px-3 py-2.5 text-sm focus:border-teal-500 focus:ring-4 focus:ring-teal-100">
      </div>
      <button type="submit" class="w-full bg-ink hover:bg-slate-800 text-white font-semibold py-3 rounded-xl">Update password</button>
    </form>
  </div>
</section>
{% endblock %}
