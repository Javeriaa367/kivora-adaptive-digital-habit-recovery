{% extends "base.html" %}
{% block title %}Habits — Kivora{% endblock %}
{% block content %}
<section class="max-w-3xl mx-auto px-5 sm:px-8 py-16">
  <h1 class="text-3xl font-display font-bold text-ink mb-2">Habit Builder</h1>
  <p class="text-slate-500 mb-8">Small, consistent habits compound. Check in daily to build your streak.</p>

  <form id="habit-form" class="flex gap-2 mb-8">
    <input id="habit-name" type="text" maxlength="60" placeholder="e.g. Drink water, Read, Sleep early"
      class="flex-1 rounded-xl border border-slate-300 px-4 py-2.5 text-sm focus:border-teal-500 focus:ring-4 focus:ring-teal-100">
    <button type="submit" class="bg-ink hover:bg-slate-800 text-white font-semibold text-sm px-5 py-2.5 rounded-xl">
      <i class="fa-solid fa-plus mr-1"></i> Add
    </button>
  </form>

  <div id="habits-list" class="space-y-3"></div>
</section>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/habits.js') }}"></script>
{% endblock %}
